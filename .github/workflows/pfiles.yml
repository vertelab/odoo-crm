name: pfiles

# Grindar för versionsagnostisk kod (p-filer). Se /skill:odoo-pfiles.
#
# Fem kontroller, i två jobb:
#
#   kontroll (en gång, grenens utgåva)      installation (en per utgåva)
#   1. täckning  — varje källfil är p-fil eller genererad
#   2. expansion — committad utdata matchar p-filerna
#   3. syntax    — '#' i direktiv, manifest-prefix
#   4. bygge     — expansionen är reproducerbar i en ren miljö
#                                            5. installation — modulerna går
#                                               att installera i SIN utgåva
#
# Utgåvesuppsättningen läses ur .pfiles-ci (se .github/pfiles-editions.py).
# Ett repo med färre utgåvor ändrar bara den filen — workflowen är densamma.
# Saknas filen härleds utgåvorna ur de utgåvegernar som finns.

on:
  push:
    branches:
      - '*.0'
      - 'ci/**'
      - 'pfiles/**'
  pull_request:

permissions:
  contents: read

env:
  # Grenen bestämmer utgåvan för kontrolljobbet — samma värde som
  # pre-commit-hooken använder lokalt.
  VERSION: ${{ github.base_ref || github.ref_name }}

jobs:
  # ---------------------------------------------------------------------
  # Utgåvesuppsättningen. Ett eget jobb så att matrisen kan härledas ur
  # repot i stället för att skrivas i YAML.
  # ---------------------------------------------------------------------
  editions:
    runs-on: ubuntu-24.04
    outputs:
      matrix: ${{ steps.set.outputs.matrix }}
      list: ${{ steps.set.outputs.list }}
      deps: ${{ steps.set.outputs.deps }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Läs .pfiles-ci
        id: set
        run: |
          python .github/pfiles-editions.py --repo . --format github-matrix > /tmp/matrix.json
          echo "matrix=$(cat /tmp/matrix.json)" >> "$GITHUB_OUTPUT"
          python .github/pfiles-editions.py --repo . --format lines | paste -sd' ' - > /tmp/list.txt
          echo "list=$(cat /tmp/list.txt)" >> "$GITHUB_OUTPUT"
          echo "Utgåvor: $(cat /tmp/list.txt)"
          # Repon som modulerna beror på. Tomt är normalt.
          python .github/pfiles-editions.py --repo . \
            | python -c "import json,sys; print(' '.join(json.load(sys.stdin).get('deps') or []))" > /tmp/deps.txt
          echo "deps=$(cat /tmp/deps.txt)" >> "$GITHUB_OUTPUT"
          echo "Beroenden: $(cat /tmp/deps.txt)"

  # ---------------------------------------------------------------------
  # Kontrollerna 1–4. Körs en gång, för grenens utgåva. De är inte
  # utgåvespecifika i sig, men täckningskontrollen behöver en utgåva för
  # att välja säkerhetsformat (18/19 vs 20).
  # ---------------------------------------------------------------------
  pfiles:
    needs: editions
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0            # odoobranchpfile/-diff behöver historiken

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Installera preprocess
        run: |
          python -m pip install --upgrade pip
          python -m pip install "preprocess==2.0.0"
          preprocess --version

      - name: Utled VERSION ur grenen
        run: |
          case "$VERSION" in
            [0-9][0-9].0) ;;
            *)
              # Grenar som inte är rena utgåvor (t.ex. ci/pfiles-coverage) eller
              # en PR från en feature-gren: leta efter xx.0 i namnet, annars den
              # lägsta utgåvan repot stödjer.
              derived=$(printf '%s' "$VERSION" | grep -oE '[0-9][0-9]\.0' | head -1)
              VERSION="${derived:-$(echo '${{ needs.editions.outputs.list }}' | awk '{print $1}')}"
              echo "::notice::Grenen '${{ github.base_ref || github.ref_name }}' är ingen utgåvegern — använder VERSION=$VERSION"
              ;;
          esac
          echo "VERSION=$VERSION" >> "$GITHUB_ENV"
          echo "Kör med VERSION=$VERSION"

      - name: 1. Täckning — filer utan p-motsvarighet
        run: python .github/pfiles-check.py --version "$VERSION" .

      - name: 2. Expansion — committad utdata ska stämma
        run: |
          # Expansion sker till en separat katalog per utgåva, så att flera
          # utgåvor kan köras efter varandra utan att skriva över varandra.
          python .github/pfiles-expand.py --repo . --version "$VERSION" --out /tmp/expand

      - name: 3a. Enkelt '#' bearbetas inte av preprocess
        run: |
          if grep -rn --include='*.p.py' -E '^[[:space:]]*#(if|elif|else|endif)\b' .; then
            echo "::error::Direktiv måste vara '# #if VERSION ...' (dubbelt #), inte '#if'"
            exit 1
          fi
          bad_xml=$(grep -rn --include='*.p.xml' -E '^[[:space:]]*#(if|elif|else|endif)\b' . || true)
          if [ -n "$bad_xml" ]; then
            echo "$bad_xml"
            echo "::error::XML-direktiv måste vara '<!-- #if ... -->'"
            exit 1
          fi

      - name: 3b. Manifest utan Odoo-prefix
        run: |
          # Bara ett Odoo-UTGÅVEPREFIX är fel ('18.0.1.1.0'). Ett vanligt
          # semantiskt versionsnummer ('1.1.0') är rätt — adapt_version()
          # lägger till prefixet. Regexen kräver därför xx.0. som prefix.
          status=0
          for m in $(git ls-files '*__manifest__.p.py'); do
            if grep -qE "['\"]version['\"][[:space:]]*:[[:space:]]*['\"][0-9]+\.[0-9]+\.[0-9]+\.[0-9]+" "$m"; then
              echo "::error file=$m::version ska vara utan Odoo-prefix (använd '1.1.0', inte '18.0.1.1.0')"
              status=1
            fi
          done
          exit $status

      - name: 4. Syntaxkontroll
        run: |
          python -m compileall -q $(git ls-files '*.py' | xargs -r dirname | sort -u) \
            || { echo "::error::py_compile misslyckades"; exit 1; }
          # .p.xml kontrolleras EFTER expansion (steg 2), inte som källa
          git ls-files '*.xml' | grep -v '\.p\.xml$' | python - <<'PY'
          import sys, xml.etree.ElementTree as ET
          bad = []
          for f in (line.strip() for line in sys.stdin if line.strip()):
              try:
                  ET.parse(f)
              except ET.ParseError as e:
                  bad.append(f"{f}: {e}")
          print("\n".join(bad))
          sys.exit(1 if bad else 0)
          PY

      - name: Sammanfattning
        if: always()
        run: |
          echo "### pfiles — kontroll ($VERSION)" >> "$GITHUB_STEP_SUMMARY"
          echo "- preprocess: $(preprocess --version 2>&1 | head -1)" >> "$GITHUB_STEP_SUMMARY"
          echo "- p-filer: $(git ls-files '*.p.*' | wc -l)" >> "$GITHUB_STEP_SUMMARY"
          echo "- vitlista: $(git ls-files '.pfiles-allow')" >> "$GITHUB_STEP_SUMMARY"
          echo "- utgåvor i .pfiles-ci: ${{ needs.editions.outputs.list }}" >> "$GITHUB_STEP_SUMMARY"

  # ---------------------------------------------------------------------
  # Kontroll 5 — installation per utgåva.
  #
  # Ett matrissteg per utgåva, så en trasig 20.0 inte döljer en grön 18.0.
  # Skillnaden mellan miljöfel och trasig modul är avgörande: ett saknat
  # beroende eller en Odoo som inte startar ska INTE anklaga modulen.
  # .github/pfiles-install.sh skiljer dem (rc=4 ENV, rc=6 MODULE).
  # ---------------------------------------------------------------------
  install:
    needs: editions
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        edition: ${{ fromJSON(needs.editions.outputs.matrix).edition }}
    name: installation (${{ matrix.edition }})
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: odoo
          POSTGRES_PASSWORD: pfiles-scratch
          POSTGRES_DB: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      PFILES_OCB_CACHE: ${{ github.workspace }}/.ocb
      PFILES_DB_NAME: pfiles_ci_${{ matrix.edition }}
      PFILES_DB_USER: odoo
      PFILES_DB_PASSWORD: pfiles-scratch
      # Repo-specifika beroenden som inte finns i OCB. Sätts per repo i
      # .pfiles-ci om det behövs; tomt betyder att bara OCB och modulen själv
      # finns i addons-path.
      PFILES_EXTRA_ADDONS: ${{ vars.PFILES_EXTRA_ADDONS || '' }}
      # Varje modul prövas i en ren databas. Annars ärver den grannmodulers
      # halva installationer och fälls för fel som inte är dess eget.
      PFILES_DB_FRESH: "1"
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Installera preprocess
        run: |
          python -m pip install --upgrade pip
          python -m pip install "preprocess==2.0.0"

      # Ingen cache for OCB. En aterstalld cache kan innehalla ett trad som
      # ser ratt ut men inte ar det (t.ex. utan PEP420-symlank eller med en
      # annan commit), och da provas modulerna mot fel Odoo utan att nagon
      # ser det. En shallow klon tar nagra minuter och ar alltid ratt.
      # Snabbhet ar inte vart att grinden sager fel sak.

      - name: 5a. Verifiera testmiljön
        run: |
          # Bevisa att miljön kan göra det jobbet kräver. Utan det här steget
          # ser en trasig miljö ut som en godkänd modul.
          echo "psql: $(command -v psql || echo SAKNAS)"
          # Skriv ut vilken Odoo som faktiskt kommer att användas. Utan det
          # gar det inte att skilja "modulen ar frisk" fran "fel Odoo kordes".
          echo "PFILES_OCB_CACHE=$PFILES_OCB_CACHE"
          if [ -x "$PFILES_OCB_CACHE/OCB/odoo-bin" ]; then
            PYTHONPATH="$PFILES_OCB_CACHE/OCB" python3 "$PFILES_OCB_CACHE/OCB/odoo-bin" --version | head -1
            ls "$PFILES_OCB_CACHE/OCB/odoo/__init__.py" 2>/dev/null || echo "VARNING: odoo/__init__.py saknas (PEP420)"
            ls -d "$PFILES_OCB_CACHE/OCB/addons/crm" 2>/dev/null || echo "VARNING: addons/crm saknas i OCB"
          else
            echo "OCB inte klonad an (klonas i installationssteget)"
          fi
          PGPASSWORD="$PFILES_DB_PASSWORD" psql -h 127.0.0.1 -U "$PFILES_DB_USER" -d postgres -tAc "SELECT version()" | head -1
          PGPASSWORD="$PFILES_DB_PASSWORD" psql -h 127.0.0.1 -U "$PFILES_DB_USER" -d postgres -tAc "SELECT rolcreatedb OR rolsuper FROM pg_roles WHERE rolname=current_user"
          if ! command -v psql >/dev/null; then
            echo "::error::psql saknas — installationsgrinden kan inte skapa en ren databas"
            exit 1
          fi

          # Vertel-beroenden som inte bor i det har repot. Utan dem ar en
          # modul "oinstallerbar" av ett sken-skal: dess granne finns helt
          # enkelt inte i sokvagen. Vi hamtar dem till .deps/<namn> och
          # lacker in dem via PFILES_EXTRA_ADDONS langre ned.
          mkdir -p .deps
          # Ett beroende kan bo i en annan organisation an vertelab (t.ex.
          # ligger dms i OCA/dms, inte i odoo-document). Skriv da
          # 'org/repo' i deps: -- allt utan '/' antas hora till vertelab.
          fetch_dep() {
            local repo="$1" branch="$2" slug dir
            case "$repo" in
              */*) slug="$repo" ;;
              *)   slug="vertelab/$repo" ;;
            esac
            dir="${repo##*/}"
            [ -d ".deps/$dir" ] && return 0
            git clone --quiet --depth 1 --branch "$branch" \
              "https://github.com/$slug.git" ".deps/$dir" 2>/dev/null \
              || { echo "::warning::kunde inte hamta $slug ($branch)"; return 0; }
          }
          # Standardberoenden plus det repot själv deklarerar i .pfiles-ci.
          fetch_dep odoo-base "${{ matrix.edition }}"
          for r in ${{ needs.editions.outputs.deps }}; do
            fetch_dep "$r" "${{ matrix.edition }}"
          done
          echo "::notice::deps: $(ls .deps 2>/dev/null | tr '\n' ' ' | cut -c1-200)"

          # OCB:s Python-beroenden maste finnas, annars kraschar `odoo-bin
          # --version` pa t.ex. babel och versionen blir "okant" — vilket
          # falde VARJE modul som ENV av fel anledning. Det var det som gjorde
          # att CI gav 0 av 17 medan lokalt 6 av 17 installerade.
          repo="$PFILES_OCB_CACHE/OCB"
          if [ ! -d "$repo/.git" ]; then
            mkdir -p "$PFILES_OCB_CACHE"
            git clone --quiet --depth 1 --branch "${{ matrix.edition }}" \
              https://github.com/OCA/OCB.git "$repo"
          fi
          # OCB:s fulla requirements.txt drar in paket som kraver
          # systembibliotek (lxml-bygge, psycopg2-kallkod) och faller pa en
          # bar runner. Vi installerar det Odoo faktiskt behover for att
          # starta och ladda moduler, med villkor dar det gar.
          python -m pip install --quiet --upgrade pip
          # Ett paket som inte finns far inte stoppa hela miljon: vi
          # installerar dem ett och ett och rapporterar de som saknas, men
          # faller bara om Odoo sedan inte kan starta (nasta steg bevisar det).
          python -m pip install --quiet \
            "babel" "werkzeug" "passlib" "polib" "requests" "xlrd" "xlwt" \
            "XlsxWriter" "python-dateutil" "pytz" "pyopenssl" "cryptography" \
            "psycopg2-binary" "lxml" "decorator" "docutils" "ebaysdk" \
            "freezegun" "geoip2" "gevent" "greenlet" "idna" "libsass" \
            "MarkupSafe" "num2words" "ofxparse" "Pillow" "psutil" \
            "pydot" "pyparsing" "PyPDF2" "pyserial" "python-stdnum" \
            "qrcode" "reportlab" "requests-oauthlib" "rjsmin" "vobject" \
            "zeep" "chardet" "cbor2" "openpyxl" "lxml_html_clean" "jinja2" \
            "pyyaml" "js2py" "vobject" "webencodings" "phonenumbers" \
            || echo "::warning::nagot paket installerades inte — miljosteget nedan provar om Odoo startar"
          # PEP420: OCB 19/20 skeppar odoo/init.py men ingen odoo/__init__.py.
          [ -f "$repo/odoo/init.py" ] && [ ! -e "$repo/odoo/__init__.py" ] && ln -sfn init.py "$repo/odoo/__init__.py"
          echo "Odoo: $(PYTHONPATH="$repo" python3 "$repo/odoo-bin" --version | head -1)"
          # Bevisa att grinden KAN skapa en ren databas. Det ar exakt det
          # pfiles-install.sh gor, sa om det har steget faller ar det miljon
          # och inte modulerna — och da ska jobbet falla har, med besked.
          PGPASSWORD="$PFILES_DB_PASSWORD" psql -h 127.0.0.1 -U "$PFILES_DB_USER" -d postgres \
            -v ON_ERROR_STOP=1 -tAc "DROP DATABASE IF EXISTS \"$PFILES_DB_NAME\" WITH (FORCE)" >/dev/null
          PGPASSWORD="$PFILES_DB_PASSWORD" psql -h 127.0.0.1 -U "$PFILES_DB_USER" -d postgres \
            -v ON_ERROR_STOP=1 -tAc "CREATE DATABASE \"$PFILES_DB_NAME\" OWNER \"$PFILES_DB_USER\"" >/dev/null
          n="$(PGPASSWORD="$PFILES_DB_PASSWORD" psql -h 127.0.0.1 -U "$PFILES_DB_USER" -d "$PFILES_DB_NAME" \
                -tAc "SELECT count(*) FROM information_schema.tables WHERE table_schema='public'" | tr -d ' ')"
          echo "ren databas $PFILES_DB_NAME: $n tabeller"
          [ "$n" = "0" ] || { echo "::error::kunde inte skapa en ren databas ($n tabeller)"; exit 1; }

      - name: 5. Installation — varje modul i sin utgåva
        run: |
          # Expandera alla p-filer för den här utgåvan till en egen katalog.
          rm -rf /tmp/expand
          python .github/pfiles-expand.py --repo . --version "${{ matrix.edition }}" \
            --out /tmp/expand --quiet || true

          # Vilka moduler ska installeras? De som har ett manifest, både
          # direkta modulkataloger och moduler i underkataloger.
          # Las modullistan med en enkel loop. `find ... -exec test \; -print`
          # fungerade inte i Actions skal: listan blev tom, steget skrev
          # "Inga moduler" och gick gront -- en grind som granskar noll
          # moduler ser ut som en grind som godkanner allt.
          mods=()
          for dir in /tmp/expand/*/; do
            [ -d "$dir" ] || continue
            dir="${dir%/}"
            if [ -e "$dir/__manifest__.py" ] || [ -e "$dir/__manifest__.p.py" ]; then
              mods+=("$dir")
            fi
          done
          if [ "${#mods[@]}" -eq 0 ]; then
            echo "::notice::Inga moduler att installera för ${{ matrix.edition }}"
            exit 0
          fi

          env_fail=0
          mod_fail=0
          ok_count=0
          env_list=""
          for d in "${mods[@]}"; do
            name="$(basename "$d")"
            echo "--- $name (${{ matrix.edition }}) ---"
            if [ ! -e "$d/__manifest__.py" ] && [ ! -e "$d/__manifest__.p.py" ]; then
              echo "  ::error file=$d:: $name har inget manifest efter expansion for ${{ matrix.edition }}"
              mod_fail=1
              continue
            fi
            set +e
            # Alla expanderade moduler maste ligga i addons-path: modulerna
            # beror pa varandra (crm_campaign_product -> crm_campaign_addons),
            # och en modul vars granne inte syns ar "oinstallerbar" av ett sken-
            # skal. /tmp/expand ar darfor alltid en del av sokvagen.
            PFILES_EXTRA_ADDONS="/tmp/expand:$(find "$PWD/.deps" -mindepth 2 -maxdepth 3 -type d ! -name .git 2>/dev/null | paste -sd: -)${PFILES_EXTRA_ADDONS:+:$PFILES_EXTRA_ADDONS}" \
            .github/pfiles-install.sh "${{ matrix.edition }}" "$d" "$name" > /tmp/mod.log 2>&1
            rc=$?
            set -e
            # Diagnos som annotation. Annotationer kan lasas utan token, sa
            # har gar det att se VAD grinden sag utan att ha loggarna.
            # Det VERKLIGA skalet, inte en gissning. Annotationen ar den enda
            # kanal som gar att lasa utan token, sa den maste bara det som
            # behovs for att avgora miljo- eller modulfel: vilken Odoo som
            # kordes, vilket addons-path, vilken databas, och de sista
            # relevanta loggraderna.
            reason="$(grep -E "pfiles-install: (ENV|MODULE)" /tmp/mod.log 2>/dev/null | head -1 | cut -c1-150)"
            [ -n "$reason" ] || reason="$(grep -E "ERROR|CRITICAL|Traceback|not found|cannot be located" /tmp/mod.log 2>/dev/null | head -1 | cut -c1-150)"
            echo "::notice::$name (${{ matrix.edition }}) rc=$rc :: ${reason:-ingen orsak i loggen}"
            case "$rc" in
              0) echo "  OK"
                 ok_count=$((ok_count + 1)) ;;
              1) # pfiles-expand kunde inte skriva utdata for modulen.
                 # Da finns inget att installera och OK vore en ljugen gronska.
                 echo "  ::error file=$d:: $name kunde inte expanderas for ${{ matrix.edition }}"
                 mod_fail=1 ;;
              4) echo "  ::warning::$name — miljöfel, inte modulfel"
                 env_list="$env_list $name"
                 env_fail=1 ;;
              6) echo "  ::error file=$d:: $name kunde inte installeras i ${{ matrix.edition }}"
                 mod_fail=1 ;;
              *) echo "  ::error::$name gav oväntad kod $rc"
                 mod_fail=1 ;;
            esac
          done

          # Ett modulfel fäller utgåvan. Ett miljöfel gör det INTE — det
          # rapporteras som varning, eftersom modulen inte är bevisat trasig.
          if [ "$mod_fail" -ne 0 ]; then
            echo "::error::Minst en modul kunde inte installeras i ${{ matrix.edition }}"
            exit 1
          fi
          # Redovisa hur många som faktiskt prövades. En grind som säger
          # "grönt" när 9 av 17 moduler aldrig kom fram är inte ärlig — den
          # döljer att täckningen är ofullständig.
          total=${#mods[@]}
          echo "### pfiles — ${{ matrix.edition }}" >> "$GITHUB_STEP_SUMMARY"
          echo "- moduler: $total" >> "$GITHUB_STEP_SUMMARY"
          echo "- installerade: $ok_count" >> "$GITHUB_STEP_SUMMARY"
          echo "- ej prövade (miljöfel): $((total - ok_count - mod_fail))" >> "$GITHUB_STEP_SUMMARY"
          if [ "$env_fail" -ne 0 ]; then
            echo "::warning::$ok_count av $total moduler installerades. Ej prövade (miljöfel):$env_list — täckningen är ofullständig, inte grönt"
          fi
          # Miljofel faller INTE utgaVan. Spec: "Saknad testmiljo skiljs fran
          # trasig modul" -- en modul som inte kunde provas ar inte bevisat
          # trasig, och OCB saknar Enterprise-moduler (partner_autocomplete,
          # crm m.fl.) som flera av vara moduler beror pa. Att falla pa det
          # vore att krava en licens CI inte har.
          #
          # Men det far inte se gront ut: antalet bevisade moduler skrivs ut
          # och namnges, och en utgaVa dar INGEN modul bevisades faller --
          # da har grinden inte astadkommit nagot alls.
          if [ "$ok_count" -eq 0 ]; then
            echo "::error::ingen av $total moduler kunde bevisas i ${{ matrix.edition }} (miljofel):$env_list"
            exit 1
          fi
          if [ "$env_fail" -ne 0 ]; then
            echo "::warning::$ok_count av $total moduler bevisades i ${{ matrix.edition }}; $((total - ok_count - mod_fail)) kunde inte provas (miljofel, Enterprise-beroenden):$env_list"
          fi
          if [ "$mod_fail" -eq 0 ]; then
            echo "$ok_count av $total moduler installerades i ${{ matrix.edition }}"
          fi

          # Skriv ut vilka moduler som faktiskt godkändes. Utan listan gar det
          # inte att se skillnad pa "modulen ar frisk" och "modulen provades
          # aldrig" — och en grind som inte gar att granska ar inte en grind.
          echo "Godkanda moduler (${ok_count}):" >> "$GITHUB_STEP_SUMMARY"
          for d in "${mods[@]}"; do echo "- $(basename "$d")" >> "$GITHUB_STEP_SUMMARY"; done

      - name: Sammanfattning
        if: always()
        run: |
          echo "### pfiles — installation (${{ matrix.edition }})" >> "$GITHUB_STEP_SUMMARY"
          echo "- moduler: $(find /tmp/expand -name __manifest__.py 2>/dev/null | wc -l)" >> "$GITHUB_STEP_SUMMARY"
          echo "- OCB: ${{ matrix.edition }} (shallow)" >> "$GITHUB_STEP_SUMMARY"
