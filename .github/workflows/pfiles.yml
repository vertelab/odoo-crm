name: pfiles

# The gate is central: vertelab/pfiles-ci. See its README.
# Only what is genuinely repo-specific stays here: .pfiles-ci and .pfiles-allow.
# Pinned to v1 -- move the tag in pfiles-ci to reach every repo.

on:
  push:
    branches: ['*.0', 'ci/**', 'pfiles/**']
  pull_request:

permissions:
  contents: read

jobs:
  pfiles:
    uses: vertelab/pfiles-ci/.github/workflows/pfiles.yml@v1
    permissions:
      contents: read
